<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const t = new Date(); const pad = (n) => String(n).padStart(2, '0');
    this.today = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
    this.state = { menu: 'none', f: 'ทั้งหมด', live: [], loaded: false, loadErr: '', formOpen: false, editId: '', photos: [], saving: false, error: '', okMsg: '', date: this.today };
    setTimeout(() => this.load(), 0);
  }

  authVals() {
    const s = window.KBS_API ? KBS_API.session() : null;
    return { loggedIn: !!s, notLoggedIn: !s && !!(window.KBS_API && KBS_API.configured), userName: s ? s.name : '', canEdit: !!s,
      loginOpen: !!this.state.loginOpen, loginErr: this.state.loginErr || '', loginLabel: this.state.loggingIn ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ',
      openLogin: () => this.openLoginNow(),
      closeLogin: () => this.setState({ loginOpen: false, loginErr: '' }),
      logout: () => { KBS_API.logout(); this.setState({ editId: '', loginErr: '' }); },
      doLogin: () => this.doLogin(),
      loginKey: (e) => { if (e.key === 'Enter') this.doLogin(); } };
  }
  openLoginNow() { if (window.KBS_AUTH) KBS_AUTH.open(); else this.setState({ loginOpen: true }); }
  doLogin() {
    if (this.state.loggingIn) return;
    const ue = document.getElementById('lg-user'), pe = document.getElementById('lg-pass');
    const u = ue ? ue.value.trim() : '', p = pe ? pe.value : '';
    if (!u || !p) { this.setState({ loginErr: 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน' }); return; }
    this.setState({ loggingIn: true, loginErr: '' });
    KBS_API.login(u, p).then(() => { if (pe) pe.value = ''; this.setState({ loggingIn: false, loginOpen: false }); })
      .catch((e) => this.setState({ loggingIn: false, loginErr: e.message }));
  }

  load() {
    if (!window.KBS_API || !KBS_API.configured) { this.setState({ loaded: true }); return; }
    KBS_API.listNews(100).then((r) => this.setState({ live: r, loaded: true, loadErr: '' })).catch((e) => this.setState({ loaded: true, loadErr: e.message }));
  }
  fill(x) {
    setTimeout(() => {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };
      set('nw-title', x.title); set('nw-cat', x.category || 'ประกาศ'); set('nw-detail', x.detail);
      const dp = String(x.date || this.today).split('-'); if (dp.length === 3) { set('nw-year', dp[0]); set('nw-month', dp[1]); set('nw-day', dp[2]); }
      const f = document.getElementById('news-form'); if (f && f.scrollIntoView) f.scrollIntoView({ behavior: 'smooth' });
      const ti = document.getElementById('nw-title'); if (ti) ti.focus();
    }, 0);
  }
  openNew() {
    if (!KBS_API.session()) { this.openLoginNow(); return; }
    this.setState({ formOpen: true, editId: '', photos: [], error: '', okMsg: '', date: this.today });
    this.fill({ title: '', category: 'ประกาศ', detail: '', date: this.today });
  }
  startEdit(x) {
    if (!KBS_API.session()) { this.openLoginNow(); return; }
    this.setState({ formOpen: true, editId: x.id, photos: (x.photos || []).map((p) => ({ id: p.id, url: p.url })), error: '', okMsg: '', date: x.date || this.today });
    this.fill(x);
  }
  remove(x) {
    if (!KBS_API.session()) { this.openLoginNow(); return; }
    if (!window.confirm('ลบประกาศ "' + x.title + '" ?')) return;
    KBS_API.save('deleteNews', { id: x.id }).then(() => { this.setState({ okMsg: 'ลบประกาศแล้ว', formOpen: false, editId: '' }); this.load(); })
      .catch((e) => this.setState({ okMsg: '', error: 'ลบไม่สำเร็จ: ' + e.message }));
  }
  submit() {
    if (this.state.saving) return;
    const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const rec = { id: this.state.editId || undefined, title: v('nw-title'), category: v('nw-cat'), detail: v('nw-detail'),
      date: v('nw-year') + '-' + v('nw-month') + '-' + v('nw-day'),
      keepPhotos: this.state.photos.filter((p) => p.id), newPhotos: this.state.photos.filter((p) => p.data).map((p) => p.data) };
    if (!rec.title) return this.setState({ error: 'กรุณาใส่หัวข้อประกาศ' });
    const p = rec.date.split('-').map(Number); const dt = new Date(p[0], p[1] - 1, p[2]);
    if (dt.getMonth() !== p[1] - 1 || dt.getDate() !== p[2]) return this.setState({ error: 'วันที่ไม่ถูกต้อง' });
    const editing = !!this.state.editId;
    this.setState({ saving: true, error: '' });
    KBS_API.save(editing ? 'updateNews' : 'createNews', rec).then(() => {
      this.setState({ saving: false, formOpen: false, editId: '', photos: [], okMsg: editing ? 'บันทึกการแก้ไขประกาศเรียบร้อย' : 'เพิ่มประกาศเรียบร้อย', f: 'ทั้งหมด' });
      this.load();
    }).catch((e) => this.setState({ saving: false, error: 'บันทึกไม่สำเร็จ: ' + e.message }));
  }
  renderVals() {
    const TAG = { 'ประกาศ': 'color: #0A5C99; background: #E6F3FC', 'ความปลอดภัย': 'color: #8A4B00; background: #FFF1DE', 'กะการทำงาน': 'color: #3A5670; background: #EEF4FA' };
    const f = this.state.f;
    const ALL = this.state.live.map((x) => { const ph = (x.photos || [])[0];
      return { tag: x.category, tagStyle: TAG[x.category] || TAG['ประกาศ'], title: x.title, detail: x.detail || '', dateTh: KBS_API.fmtDate(x.date), by: x.postedBy || '-',
        img: ph ? KBS_API.thumb(ph, 1000) : '', viewLabel: (x.photos || []).length > 1 ? 'ดูรูป ' + x.photos.length + ' รูป' : 'ดูรูปเต็ม', view: () => window.KBS_LIGHTBOX && KBS_LIGHTBOX.open(KBS_API.gallery(x.photos), 0), edit: () => this.startEdit(x), del: () => this.remove(x) }; });
    const list = f === 'ทั้งหมด' ? ALL : ALL.filter((n) => n.tag === f);
    const cats = ['ทั้งหมด', 'ประกาศ', 'ความปลอดภัย', 'กะการทำงาน'];
    const chips = cats.map((c) => ({ label: c, sel: f === c, pick: () => this.setState({ f: c }),
